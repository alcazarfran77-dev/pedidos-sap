# Blueprint de Render: en el panel, New > Blueprint y elegir este repositorio.
services:
  - type: web
    name: pedidos-sap
    runtime: python
    plan: starter            # el plan gratuito no admite disco y se duerme: ver README
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PEDIDOS_DB
        value: /var/data/pedidos.db
      - key: APP_USER        # usuario del administrador
        sync: false
      - key: APP_PASSWORD    # contraseña del administrador
        sync: false
      - key: SFTP_PASSWORD   # contraseña del SFTP de SAP (opcional si se usa llave)
        sync: false
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
