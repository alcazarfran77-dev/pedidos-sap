<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos SAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Plan: menú fijo a la izquierda, transacción a la derecha; tablas densas con códigos SAP en monoespaciada; el estatus siempre como píldora. */
/* Paleta: bandera de Canadá. Rojo de la bandera para menú y acciones, blanco para superficies, grises neutros para texto. */
:root{
  --bg:#f6f6f7; --panel:#ffffff; --ink:#1c1c1f; --mute:#5f6066; --line:#e2e2e6; --soft:#fdeceb;
  --accent:#d52b1e; --accent-ink:#ffffff; --side:#d52b1e; --side-ink:#ffffff; --side-mute:#ffdcd8; --side-acc:#ffffff;
  --good:#2c6b3a; --warn:#856400; --bad:#b84a00; --info:#2d5f8b;
  --f-body:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif; --f-disp:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141415; --panel:#1e1e20; --ink:#f2f2f3; --mute:#a5a5ab; --line:#343439; --soft:#3a1c1e;
  --accent:#ff6b61; --accent-ink:#2a0705; --side:#a81f15; --side-ink:#ffffff; --side-mute:#ffd0cc; --side-acc:#ffffff;
  --good:#7fc48a; --warn:#e3c256; --bad:#ffa25c; --info:#8fb6dd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141415; --panel:#1e1e20; --ink:#f2f2f3; --mute:#a5a5ab; --line:#343439; --soft:#3a1c1e;
  --accent:#ff6b61; --accent-ink:#2a0705; --side:#a81f15; --side-ink:#ffffff; --side-mute:#ffd0cc; --side-acc:#ffffff;
  --good:#7fc48a; --warn:#e3c256; --bad:#ffa25c; --info:#8fb6dd; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:grid;grid-template-columns:216px 1fr}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
nav{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav .marca{font:600 19px var(--f-disp);padding:0 8px 2px} nav .sub{font-size:11.5px;color:var(--side-mute);padding:0 8px 14px}
nav a{color:var(--side-ink);text-decoration:none;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:8px;border-left:3px solid transparent}
nav a:hover{background:rgba(255,255,255,.12)} nav a.on{background:rgba(255,255,255,.2);border-left-color:var(--side-acc);font-weight:600}
nav a .n{font:500 11.5px var(--f-mono);color:var(--side-mute)}
nav .modo{margin-top:auto;font-size:11.5px;color:var(--side-mute);padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.3)}
nav .modo b{color:var(--side-ink);display:block}
nav button{background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.55);margin-top:8px}
body.acceso{grid-template-columns:1fr} body.acceso nav{display:none}
.entrada{max-width:400px;margin:8vh auto 0} .entrada form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
main{overflow:auto;padding:22px 26px 60px;min-width:0}
.cab{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.cab p{margin:2px 0 0;color:var(--mute);max-width:65ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.panel>h2{margin-bottom:10px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rej{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute);font-weight:500}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:13.5px;font-weight:400}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input[type=checkbox]{width:auto} textarea{font-family:var(--f-mono);font-size:12.5px;min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:500 13.5px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)} button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.mal{color:var(--bad)} button.min{padding:3px 9px;font-size:12.5px} button:disabled{opacity:.5;cursor:not-allowed}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>td{border-bottom:0} .r{text-align:right} th.r{text-align:right}
tr.clic{cursor:pointer} tr.clic:hover>td{background:var(--soft)}
.pil{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.pil::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.e-n{color:var(--mute)} .e-i{color:var(--info)} .e-a{color:var(--ink)} .e-g{color:var(--good)} .e-b{color:var(--bad)} .e-w{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;min-width:104px;text-align:left;display:flex;flex-direction:column;gap:2px}
.chip b{font:600 20px var(--f-disp)} .chip span{font-size:12px;color:var(--mute)} .chip.on{border-color:var(--accent);background:var(--soft)}
.nota{font-size:12.5px;border-left:3px solid var(--warn);padding:5px 10px;margin:4px 0;background:color-mix(in srgb,var(--warn) 9%,transparent)}
.nota.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.nota.inf{border-color:var(--info);background:color-mix(in srgb,var(--info) 9%,transparent)}
.mute{color:var(--mute)} .peq{font-size:12px} .cero{color:var(--bad);font-weight:600}
.pasos{display:flex;gap:0;margin:14px 0 4px;overflow-x:auto}
.paso{flex:1;min-width:84px;text-align:center;font-size:11.5px;color:var(--mute);position:relative;padding-top:18px}
.paso::before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:var(--line)}
.paso::after{content:"";position:absolute;top:0;left:50%;margin-left:-6px;width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--line)}
.paso.ok::before{background:var(--accent)} .paso.ok::after{background:var(--accent);border-color:var(--accent)} .paso.ok{color:var(--ink)}
.paso.act{font-weight:600} .paso.act::after{box-shadow:0 0 0 4px var(--soft)}
#cajon{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.18);overflow:auto;padding:20px 22px 40px;z-index:5}
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:9;padding:16px}
#velo .panel{width:min(720px,100%);max-height:92%;overflow:auto;margin:0}
#tostadas{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:12;width:min(560px,calc(100% - 32px))}
.tost{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13.5px} .tost.err{background:var(--bad);color:#fff}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:132px 1fr;gap:10px;font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none} .tabs button.on{border-bottom-color:var(--accent);font-weight:600}
pre{background:var(--soft);padding:10px 12px;border-radius:6px;overflow-x:auto;margin:8px 0 0;font:12.5px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
main a{color:var(--accent);font-weight:500}
.demo{background:var(--soft);border:1px dashed var(--accent);border-radius:8px;padding:9px 13px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav{flex-direction:row;flex-wrap:wrap;padding:10px 12px;gap:2px} nav .sub{display:none} nav .modo{margin-top:4px;border-top:0;padding:4px 8px 0;width:100%} nav .marca{width:100%;padding-bottom:6px}
  nav a{padding:6px 9px;border-left:0} nav a .n{display:none} main{padding:16px}}
@media (prefers-reduced-motion:no-preference){button,nav a{transition:background .12s,border-color .12s}}
</style>
</head>

function tm(m) { m = String(m ?? ""); if (m[0] !== "@") return m; const ps = m.slice(1).split("\x1f"), d = MSG[ps.shift()]; if (!d) return m;
  const tpl = d[LANG === "es" ? 0 : 1], n = (tpl.match(/\{\d\}/g) || []).length;
  if (n && ps.length > n) ps.splice(n - 1, ps.length, ps.slice(n - 1).join("\x1f"));
  return tpl.replace(/\{(\d)\}/g, (_, i) => tm(ps[i] ?? "")); }

    <label>${t("Cliente SAP (solo perfil Cliente)")}<input id="u-kunnr" list="l-cli-u" value="${esc(e.KUNNR)}" autocomplete="off"></label>
    <label>${t("Contraseña")}<input id="u-password" type="password" autocomplete="new-password" placeholder="${e.nuevo ? t("Mínimo 8 caracteres") : t("Vacía para no cambiarla")}"></label></div>
    <datalist id="l-cli-u">${cls.map(r => `<option value="${esc(r.KUNNR)}">${esc(r.NAME1)}</option>`).join("")}</datalist>
    <div class="fila" style="margin-top:12px"><label class="chk"><input type="checkbox" id="u-activo" ${e.activo ? "checked" : ""}>${t("Puede entrar a la aplicación")}</label>
    <button class="pri" data-act="usr-guardar">${e.nuevo ? t("Crear usuario") : t("Guardar cambios")}</button>${e.nuevo ? "" : `<button data-act="usr-nuevo">${t("Cancelar")}</button>`}</div></div>
  <div class="panel"><h2>${t("Usuarios registrados")}</h2><div class="scroll"><table><thead><tr><th>${t("Usuario")}</th><th>${t("Nombre")}</th><th>${t("Perfil")}</th><th>${t("Cliente SAP")}</th><th>${t("Acceso")}</th><th>${t("Llaves de API")}</th><th></th></tr></thead><tbody>
  ${usuarios.map(u => `<tr><td class="mono">${esc(u.usuario)}</td><td>${esc(u.nombre)}</td><td>${t(PERFIL[u.rol])}</td><td>${u.KUNNR ? `<span class="mono">${esc(u.KUNNR)}</span> ${esc(nomCli(u.KUNNR))}` : "—"}</td>
    <td>${u.activo ? `<span class="pil e-g">${t("Activo")}</span>` : `<span class="pil e-n">${t("Desactivado")}</span>`}</td>
    <td class="mono">${u.llaves || "—"}</td>
    <td><div class="fila">${u.fijo ? `<span class="mute peq">${t("Se cambia en las variables de entorno")}</span>` : `<button class="min" data-act="usr-editar" data-u="${esc(u.usuario)}">${t("Editar")}</button>${u.usuario === S.usuario.usuario ? "" : `<button class="min mal" data-act="usr-pedir-borrar" data-u="${esc(u.usuario)}">${t("Eliminar")}</button>`}`}
      ${u.llaves ? `<button class="min mal" data-act="usr-pedir-revocar-llaves" data-u="${esc(u.usuario)}">${t("Revocar llaves")}</button>` : ""}</div></td></tr>`).join("") || `<tr><td colspan="7" class="mute">${t("Aún no hay usuarios.")}</td></tr>`}
  </tbody></table></div></div>`;
}
/* ---- API para sistemas de clientes (modo servidor) ---- */
function vApi() {
  const base = location.origin + "/api/v1", cli = rol() === "cliente", hoy = (d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`)(new Date()), K = t("TU_LLAVE");
  const ej = (titulo, cmd) => `<h3 style="margin:18px 0 6px">${titulo}</h3><pre>${esc(cmd)}</pre>`;
  const ejJson = JSON.stringify({...(cli ? {} : {customer:"100040"}), customer_po:"PO-2026-1188", delivery_address:cli ? "" : "100041",
    items:[{material:"10000101", quantity:120}, {material:"10000420", quantity:60}]}, null, 2);
  const ejCsv = (cli ? "" : "customer,") + "customer_po,material,quantity,delivery_address\n" + (cli ? "" : "100040,") + "PO-2026-1189,10000101,120,\"845 Douglas St, Victoria, BC V8W 2B6\"";
  return cab(t("API para sistemas de clientes"), t("El sistema del cliente genera su archivo JSON o CSV y lo envía a esta dirección. Recibe de vuelta almacén, precio, importe y fecha planificada, y después puede consultar el estatus de cada pedido.")) +
  `<div class="panel"><h2>${t("Conexión")}</h2><div class="rej">
    <div><h3>${t("Dirección base")}</h3><div class="mono">${esc(base)}</div></div>
    <div><h3>${t("Autenticación")}</h3><div class="mono">Authorization: Bearer &lt;${esc(K)}&gt;</div></div>
    <div><h3>${t("Documentación interactiva")}</h3><a href="${esc(base)}/docs" target="_blank" rel="noopener">${esc(base)}/docs</a></div></div>
    <p class="mute peq" style="margin-bottom:0">${cli ? t("Tus llaves solo ven y crean pedidos del cliente {0}; el archivo no necesita traer el número de cliente.", esc(S.usuario.KUNNR))
      : t("Una llave tiene los permisos de su usuario. Para un cliente, crea su usuario con perfil Cliente y que él genere su llave en esta pantalla.")}</p></div>
  <div class="panel"><h2>${t("Tus llaves de API")}</h2>
    <div class="fila" style="margin-bottom:12px"><input id="llave-nombre" placeholder="${t("Nombre para identificarla, por ejemplo ERP de compras")}" style="max-width:380px" aria-label="${t("Nombre de la llave")}"><button class="pri" data-act="llave-crear">${t("Generar llave")}</button></div>
    <div class="scroll"><table><thead><tr><th>${t("Nombre")}</th><th>${t("Llave")}</th><th>${t("Creada")}</th><th>${t("Último uso")}</th><th></th></tr></thead><tbody>
    ${llaves.map(k => `<tr><td>${esc(k.nombre)}</td><td class="mono">${esc(k.prefijo)}…</td><td>${fch(k.creada)}</td><td>${k.ultimo_uso ? fch(k.ultimo_uso) : t("Nunca")}</td>
      <td><button class="min mal" data-act="llave-pedir-revocar" data-id="${k.id}" data-n="${esc(k.nombre)}">${t("Revocar")}</button></td></tr>`).join("") || `<tr><td colspan="5" class="mute">${t("Aún no tienes llaves.")}</td></tr>`}
    </tbody></table></div></div>
  <div class="panel"><h2>${t("Cómo se usa")}</h2>
    <p class="mute peq">${t("En Windows escribe curl.exe en lugar de curl. Reemplaza {0} por tu llave.", esc(K))}</p>
    ${ej(t("Enviar el archivo JSON que genera tu sistema"), `curl -X POST "${base}/orders" -H "Authorization: Bearer ${K}" -H "Content-Type: application/json" --data-binary @order.json`)}
    ${ej(t("Enviar un CSV y recibir la respuesta en CSV"), `curl -X POST "${base}/orders?format=csv" -H "Authorization: Bearer ${K}" -H "Content-Type: text/csv" --data-binary @orders.csv -o response.csv`)}
    ${ej(t("Enviar a SAP de inmediato los pedidos sin errores"), `curl -X POST "${base}/orders?send=true" -H "Authorization: Bearer ${K}" -H "Content-Type: application/json" --data-binary @order.json`)}
    ${ej(t("Consultar el estatus de tus pedidos desde una fecha (CSV)"), `curl "${base}/orders?since=${hoy}&format=csv" -H "Authorization: Bearer ${K}" -o status.csv`)}
    ${ej(t("Consultar precios y disponibilidad"), `curl "${base}/materials?format=csv" -H "Authorization: Bearer ${K}" -o materials.csv`)}
    ${ej(t("Ejemplo de archivo JSON"), ejJson)}${ej(t("Ejemplo de archivo CSV"), ejCsv)}
    <ul class="peq" style="margin:16px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
      <li>${t("Si el pedido del cliente ya existe, la API responde 409 y no lo duplica; agrega allow_duplicate=true para crearlo de todos modos.")}</li>
      <li>${t("Un pedido con errores (material o precio inexistente) se guarda como borrador y la respuesta explica cada error.")}</li>
      <li>${t("Las respuestas vienen en inglés; agrega lang=es para recibir los mensajes en español.")}</li>
      <li>${t("Los campos y columnas aceptan los mismos nombres y alias que la carga de archivos (ver Formatos de archivo).")}</li></ul></div>`;
}
function modalLlave(k) {
  modal(`<h2>${t("Llave generada: {0}", esc(k.nombre))}</h2><p>${t("Cópiala y guárdala ahora en el sistema que se va a conectar. Por seguridad no se vuelve a mostrar; si la pierdes, revócala y genera otra.")}</p>
  <textarea id="json-txt" readonly style="min-height:64px">${esc(k.llave)}</textarea>
  <div class="fila" style="margin-top:12px;justify-content:flex-end"><button data-act="copiar-json" data-ok="Llave copiada">${t("Copiar")}</button><button class="pri" data-act="cerrar-modal">${t("Listo, ya la guardé")}</button></div>`);
}
let accesoEstado = null;
function pantallaAcceso(instalar, msg) {
  accesoEstado = {instalar, msg}; document.documentElement.lang = LANG;
  document.body.classList.add("acceso"); $("#cajon").hidden = true; cerrarModal();
  $("#vista").innerHTML = `<div class="panel entrada"><div class="fila" style="justify-content:space-between"><h1>${t("Pedidos SAP")}</h1>${btnIdioma()}</div><p class="mute">${instalar ? t("Primer arranque: crea el usuario administrador.") : t("Entra con tu usuario.")}</p>
    ${msg ? `<div class="nota err">${esc(tm(msg))}</div>` : ""}<form id="f-acceso" data-instalar="${instalar ? 1 : ""}">
    <label>${t("Usuario")}<input id="a-usuario" autocomplete="username" required></label>${instalar ? `<label>${t("Nombre")}<input id="a-nombre" autocomplete="name"></label>` : ""}
    <label>${t("Contraseña")}<input id="a-password" type="password" autocomplete="${instalar ? "new-password" : "current-password"}" required ${instalar ? 'minlength="8"' : ""}></label>
    <button class="pri" type="submit">${instalar ? t("Crear administrador y entrar") : t("Entrar")}</button></form></div>`;
  const u = $("#a-usuario"); if (u) u.focus();
}
document.addEventListener("submit", async ev => { if (ev.target.id !== "f-acceso") return; ev.preventDefault();
  const inst = !!ev.target.dataset.instalar, d = {usuario:$("#a-usuario").value, password:$("#a-password").value, nombre:inst ? $("#a-nombre").value : ""};
  try { if (inst) await Api.f("POST", "instalar", d); await Api.f("POST", "login", d);
    await B.estado(); document.body.classList.remove("acceso"); capNueva(); abierto = null; ruta(); }
  catch (e) { pantallaAcceso(inst, e.message); } });

function pintar() {
  if (document.body.classList.contains("acceso")) return;
  document.documentElement.lang = LANG; document.title = t("Pedidos SAP");
  pintarMenu();
  const foco = document.activeElement && document.activeElement.id, pos = foco && document.activeElement.selectionStart;
  $("#vista").innerHTML = ({pedidos:vPedidos, captura:vCaptura, recepcion:vRecepcion, inventario:vInventario, maestros:vMaestros, sap:vSap, formatos:vFormatos, api:vApi, usuarios:vUsuarios}[vista])();
  if (foco && $("#" + foco) && ["buscar","buscar-inv"].includes(foco)) { const el = $("#" + foco); el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
  pintarCajon();
}
async function ruta() { const h = location.hash.slice(1); vista = vistasVisibles().some(v => v[0] === h) ? h : "pedidos"; if (vista !== "pedidos") abierto = null;
  if (vista === "usuarios") { try { usuarios = await Api.f("GET", "usuarios"); } catch (e) { tost(e.message, true); } }
  if (vista === "api") { try { llaves = await Api.f("GET", "llaves"); } catch (e) { tost(e.message, true); } }
  if (B === Api && ["pedidos","inventario"].includes(vista)) { try { await B.estado(); } catch (e) {} }
  pintar(); if (vista === "captura") previsualizar(); }
const confirmar = (titulo, texto, act, attrs, boton) => modal(`<h2>${titulo}</h2><p>${texto}</p><div class="fila" style="justify-content:flex-end"><button data-act="cerrar-modal">${t("Conservar")}</button><button class="pri" data-act="${act}" ${attrs}>${boton}</button></div>`);

document.addEventListener("click", async ev => {
  if (ev.target.id === "velo") return cerrarModal();
  const el = ev.target.closest("[data-act]"); if (!el) return; const a = el.dataset.act, id = el.dataset.id;
  if (a === "ir") location.hash = el.dataset.v;
  else if (a === "idioma") { LANG = LANG === "es" ? "en" : "es"; try { localStorage.setItem("pedidosSAP.lang", LANG); } catch (e) {}
    if (document.body.classList.contains("acceso")) pantallaAcceso(accesoEstado.instalar, accesoEstado.msg); else { pintar(); if (vista === "captura") previsualizar(); } }
  else if (a === "filtro") { filtro.est = el.dataset.e; pintar(); }
  else if (a === "abrir") { abierto = id; pintarCajon(); }
  else if (a === "cerrar-cajon") { abierto = null; pintarCajon(); }
  else if (a === "cerrar-modal") cerrarModal();
  else if (a === "ver-json") verJson(S.pedidos.find(p => p.id === id));
  else if (a === "copiar-json") { try { await navigator.clipboard.writeText($("#json-txt").value); tost(t(el.dataset.ok || "JSON copiado")); } catch (e) { $("#json-txt").select(); tost(t("Selecciona el texto y cópialo con Ctrl+C"), true); } }
  else if (a === "bajar-json") descargar(el.dataset.nom, $("#json-txt").value);
  else if (a === "enviar") { const p = await hacer(() => B.enviar(id), r => conSftp() ? t("{0} enviado a SAP: {1}", id, r.archivo_sap) : t("{0} listo para SAP", id)); if (p && !conSftp() && rol() !== "cliente") verJson(S.pedidos.find(x => x.id === id), true); }
  else if (a === "recalcular") hacer(() => B.recalcular(id), t("{0} recalculado", id));
  else if (a === "editar") { const p = S.pedidos.find(x => x.id === id), e = p.entrada, esDest = e.DIRECCION === "" || S.clientes.some(r => r.KUNNR === p.KUNNR && r.KUNWE === e.DIRECCION);
    cap = {id, KUNNR:p.KUNNR, BSTKD:e.BSTKD, dirSel:esDest ? e.DIRECCION : "__otra__", dirTxt:esDest ? "" : e.DIRECCION, pos:p.posiciones.map((x, i) => ({MATERIAL:e.posiciones[i].MATERIAL ?? "", CANTIDAD:e.posiciones[i].CANTIDAD ?? "", WERKS:x.forzado ? x.WERKS : ""})), prev:null};
    abierto = null; location.hash = "captura"; }
  else if (a === "pedir-eliminar") confirmar(t("Eliminar {0}", esc(id)), t("El borrador se borra y su inventario comprometido se libera. No se puede deshacer."), "eliminar", `data-id="${esc(id)}"`, t("Eliminar pedido"));
  else if (a === "eliminar") { cerrarModal(); abierto = null; hacer(() => B.eliminar(id), t("{0} eliminado", id)); }
  else if (a === "mas-pos") { cap.pos.push({MATERIAL:"", CANTIDAD:"", WERKS:""}); pintar(); }
  else if (a === "quitar-pos") { cap.pos.splice(Number(el.dataset.i), 1); pintar(); previsualizar(); }
  else if (a === "cap-limpiar") { capNueva(); pintar(); }
  else if (a === "guardar") guardarCaptura(false);
  else if (a === "guardar-enviar") guardarCaptura(true);
  else if (a === "subir-ped") { const fs = [...$("#f-ped").files]; if (!fs.length) return tost(t("Elige al menos un archivo"), true); recRes = await importarArchivos("pedidos", fs); pintar(); }
  else if (a === "pegar-ped") { const x = $("#t-ped").value, nom = t("contenido pegado"); if (!x.trim()) return tost(t("Pega el contenido del archivo"), true);
    try { recRes = [{nombre:nom, ok:true, msg:await B.importar("pedidos", x.trim()[0] === "[" || x.trim()[0] === "{" ? "pasted.json" : "pasted.csv", x)}]; } catch (e) { recRes = [{nombre:nom, ok:false, msg:e.message}]; }
    if (B === Api) await B.estado(); pintar(); }
  else if (a === "tab") { tabM = el.dataset.t; pintar(); }
  else if (a === "subir-mae") { const fs = [...$("#f-mae").files]; if (!fs.length) return tost(t("Elige al menos un archivo"), true); const r = await importarArchivos(tabM, fs); r.forEach(x => tost(`${x.nombre}: ${tm(x.msg)}`, !x.ok)); pintar(); }
  else if (a === "elegir") $("#f-" + el.dataset.t).click();
  else if (a === "sync") hacer(() => B.sync(el.dataset.t), m => `${nomTipo(el.dataset.t)}: ${tm(m)}`);
  else if (a === "probar") hacer(async () => { await B.guardarConfig(leerCfg()); return B.probar(); }, m => m);
  else if (a === "guardar-cfg") hacer(() => B.guardarConfig(leerCfg()), t("Configuración guardada"));
  else if (a === "demo") hacer(() => B.demo(), t("Datos de demostración cargados"));
  else if (a === "vaciar") confirmar(t("Vaciar datos"), t("Se borran de este navegador los datos maestros, el inventario y todos los pedidos."), "vaciar-si", "", t("Vaciar todo"));
  else if (a === "salir") { try { await Api.f("POST", "logout"); } catch (e) {} S.pedidos = []; pantallaAcceso(false); }
  else if (a === "usr-nuevo") { usrEd = null; pintar(); }
  else if (a === "usr-editar") { usrEd = {...usuarios.find(u => u.usuario === el.dataset.u), nuevo:false}; pintar(); $("#u-nombre").focus(); }
  else if (a === "usr-guardar") { const d = {usuario:$("#u-usuario").value, nombre:$("#u-nombre").value, rol:$("#u-rol").value, KUNNR:$("#u-kunnr").value, password:$("#u-password").value, activo:$("#u-activo").checked, nuevo:!usrEd};
    await hacer(async () => { await Api.f("PUT", "usuarios", d); usuarios = await Api.f("GET", "usuarios"); usrEd = null; }, t("Usuario {0} guardado", d.usuario.trim().toLowerCase())); }
  else if (a === "usr-pedir-borrar") confirmar(t("Eliminar usuario {0}", esc(el.dataset.u)), t("Ya no podrá entrar y sus llaves de API dejan de funcionar. Sus pedidos se conservan."), "usr-borrar", `data-u="${esc(el.dataset.u)}"`, t("Eliminar usuario"));
  else if (a === "usr-borrar") { cerrarModal(); hacer(async () => { await Api.f("DELETE", "usuarios/" + encodeURIComponent(el.dataset.u)); usuarios = await Api.f("GET", "usuarios"); }, t("Usuario eliminado")); }
  else if (a === "llave-crear") { const nom = $("#llave-nombre").value;
    const k = await hacer(async () => { const r = await Api.f("POST", "llaves", {nombre:nom}); llaves = await Api.f("GET", "llaves"); return r; });
    if (k && k.llave) modalLlave(k); }
  else if (a === "llave-pedir-revocar") confirmar(t("Revocar llave {0}", esc(el.dataset.n)), t("El sistema que la use dejará de poder conectarse. No se puede deshacer."), "llave-revocar", `data-id="${esc(id || el.dataset.id)}"`, t("Revocar llave"));
  else if (a === "llave-revocar") { cerrarModal(); hacer(async () => { await Api.f("DELETE", "llaves/" + encodeURIComponent(el.dataset.id)); llaves = await Api.f("GET", "llaves"); }, t("Llave revocada")); }
  else if (a === "usr-pedir-revocar-llaves") confirmar(t("Revocar las llaves de {0}", esc(el.dataset.u)), t("Los sistemas que usen sus llaves dejarán de poder conectarse. No se puede deshacer."), "usr-revocar-llaves", `data-u="${esc(el.dataset.u)}"`, t("Revocar llaves"));
  else if (a === "usr-revocar-llaves") { cerrarModal(); hacer(async () => { await Api.f("DELETE", "usuarios/" + encodeURIComponent(el.dataset.u) + "/llaves"); usuarios = await Api.f("GET", "usuarios"); }, t("Llaves revocadas")); }
  else if (a === "vaciar-si") { cerrarModal(); await Local.vaciar(); capNueva(); pintar(); tost(t("Datos vaciados")); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("tr.clic")) ev.target.click(); if (ev.key === "Escape") { if (!$("#velo").hidden) cerrarModal(); else if (abierto) { abierto = null; pintarCajon(); } } });
document.addEventListener("input", ev => { const x = ev.target;
  if (x.id === "buscar") { filtro.q = x.value; pintar(); } else if (x.id === "buscar-inv") { qInv = x.value; pintar(); }
  else if (x.id === "c-cli") { cap.KUNNR = x.value; if (S.clientes.some(r => r.KUNNR === x.value.trim())) { cap.dirSel = ""; $("#c-dir").innerHTML = opcionesDir(); $("#c-otra").hidden = true; } previsualizar(); }
  else if (x.id === "c-ped") { cap.BSTKD = x.value; previsualizar(); }
  else if (x.id === "c-dirtxt") { cap.dirTxt = x.value; previsualizar(); }
  else if (x.dataset.pos != null) { const p = cap.pos[Number(x.dataset.pos)]; p[x.dataset.k] = x.value; if (x.dataset.k === "MATERIAL") p.WERKS = ""; previsualizar(); } });
document.addEventListener("change", async ev => { const x = ev.target;
  if (x.id === "c-dir") { cap.dirSel = x.value; $("#c-otra").hidden = x.value !== "__otra__"; cap.pos.forEach(p => p.WERKS = ""); previsualizar(); }
  else if (x.dataset.alm != null) { const act = cap.pos.filter(p => String(p.MATERIAL).trim() || String(p.CANTIDAD).trim()); act[Number(x.dataset.alm)].WERKS = x.value; previsualizar(); }
  else if (x.type === "file" && x.dataset.tipo) { const r = await importarArchivos(x.dataset.tipo, [...x.files]); r.forEach(y => tost(`${y.nombre}: ${tm(y.msg)}`, !y.ok)); pintar(); } });
window.addEventListener("hashchange", ruta);

(async function iniciar() {
  let servidor = false;
  if (location.protocol.startsWith("http")) { try { const c = new AbortController(); setTimeout(() => c.abort(), 2500);
    const r = await fetch("api/ping", {signal:c.signal}); servidor = r.ok && (await r.json()).app === "pedidos-sap"; } catch (e) {} }
  B = servidor ? Api : Local;
  if (servidor) { S = {pedidos:[], clientes:[], inventario:[], modo:"servidor"};
    try { await Api.f("GET", "sesion"); await B.estado(); ruta(); } catch (e) { pantallaAcceso(!!(e.datos && e.datos.instalar)); } }
  else { await B.estado(); ruta(); }
  if (servidor) setInterval(async () => { const ae = document.activeElement; if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return; if (!$("#velo").hidden || document.body.classList.contains("acceso") || !["pedidos","inventario"].includes(vista)) return;
    try { await B.estado(); pintar(); } catch (e) {} }, 30000);
})();
</script>
